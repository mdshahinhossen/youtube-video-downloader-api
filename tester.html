<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Downloader API Tester</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17212b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.card{max-width:620px;margin:30px auto;background:#fff;border:1px solid #e4eaf1;border-radius:18px;padding:24px;box-shadow:0 12px 35px #14243b0c}h1{font-size:24px;margin:0 0 8px}p{color:#637083;line-height:1.5}label{display:block;font-weight:600;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #d5deea;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:10px;background:#1677df;color:#fff;font-size:16px;font-weight:700;padding:14px;margin-top:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{margin-top:16px;padding:12px;border-radius:10px;background:#f2f5f9;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:none;margin-top:18px}.meta img{width:100%;max-height:260px;object-fit:cover;border-radius:12px}.small{font-size:13px}
</style></head>
<body><main class="card"><h1>YouTube Video Downloader</h1><p>Paste a public YouTube video URL. The API automatically chooses the best available quality; you do not need to select a resolution.</p>
<label for="url">YouTube video URL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="url">
<button id="infoBtn" type="button">Get Video Info</button><button id="downloadBtn" type="button">Download Video</button>
<div id="status" class="status" role="status">Ready.</div><section id="meta" class="meta"><img id="thumb" alt="Video thumbnail"><h2 id="title"></h2><p id="author"></p></section><p class="small">If YouTube temporarily returns HTTP 429, wait a while before retrying.</p></main>
<script>
const $=id=>document.getElementById(id);const status=$('status');
function getUrl(){return $('url').value.trim()}
async function readError(response){let body;try{body=await response.json()}catch{body={error:'Unexpected server response.'}}return body.error||body.message||`Request failed (${response.status})`}
$('infoBtn').addEventListener('click',async()=>{const url=getUrl();if(!url){status.textContent='Please enter a YouTube URL.';return}const btn=$('infoBtn');btn.disabled=true;status.textContent='Loading video information…';try{const r=await fetch('/video_info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!r.ok)throw new Error(await readError(r));const d=await r.json();$('title').textContent=d.title||'Untitled video';$('author').textContent=d.author||'';$('thumb').src=d.thumbnail_url||'';$('meta').style.display='block';status.textContent='Video information loaded.'}catch(e){status.textContent=e.message}finally{btn.disabled=false}});
$('downloadBtn').addEventListener('click',async()=>{const url=getUrl();if(!url){status.textContent='Please enter a YouTube URL.';return}const btn=$('downloadBtn');btn.disabled=true;status.textContent='Preparing video. Please keep this page open…';try{const r=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!r.ok)throw new Error(await readError(r));const blob=await r.blob();const disposition=r.headers.get('Content-Disposition')||'';const match=disposition.match(/filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i);let name='youtube_video.mp4';if(match)name=decodeURIComponent(match[1]||match[2]);const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),60000);status.textContent='Download started.'}catch(e){status.textContent=e.message}finally{btn.disabled=false}});
</script></body></html>
